    const grid = document.getElementById('skills-grid');
    const searchInput = document.getElementById('search');
    const filterPills = document.querySelectorAll('.pill');
    const countDisplay = document.getElementById('count');

    let currentFilter = 'all';
    let searchQuery = '';

    function render() {
      const filtered = skills.filter(s => {
        const matchesFilter = currentFilter === 'all' || s.category.startsWith(currentFilter);
        const matchesSearch = s.name.toLowerCase().includes(searchQuery) ||
                              s.description.toLowerCase().includes(searchQuery) ||
                              s.aliases.some(a => a.toLowerCase().includes(searchQuery));
        return matchesFilter && matchesSearch;
      });

      countDisplay.textContent = `Showing ${filtered.length} of ${skills.length} skills`;

      grid.innerHTML = filtered.map(s => `
        <div class="card">
          <div>
            <div class="card-header">
              <span class="skill-name">${s.name}</span>
              <span class="stage-tag">${s.category.split(' - ')[0]}</span>
            </div>
            <p class="card-desc">${s.description}</p>
          </div>
          <div class="card-footer">
            <span class="aliases" title="${s.aliases.join(', ')}">${s.aliases.slice(0, 3).join(', ')}</span>
            <button class="btn-copy" onclick="copyPrompt(event, '${s.name}')">Copy Prompt</button>
          </div>
        </div>
      `).join('');
    }

    function copyPrompt(event, name) {
      const prompt = `Use the '${name}' skill guidelines to implement this request.`;
      navigator.clipboard.writeText(prompt).then(() => {
        const btn = event.target;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy Prompt', 1500);
      });
    }

    searchInput.addEventListener('input', e => {
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    });

    filterPills.forEach(pill => {
      pill.addEventListener('click', () => {
        filterPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.filter;
        render();
      });
    });

    render();
  </script>
